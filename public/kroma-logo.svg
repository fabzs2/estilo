<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="bladeBlue" x1="128" y1="112" x2="216" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bladeViolet" x1="384" y1="112" x2="220" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bladeEmerald" x1="236" y1="244" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Base Carbon Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="12"/>

  <!-- Subtle Technical Registration Marks (Estamparia / Plotter Cropping Marks) -->
  <path d="M76 108V76H108" stroke="#3f3f46" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M436 108V76H404" stroke="#3f3f46" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M76 404V436H108" stroke="#3f3f46" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M436 404V436H404" stroke="#3f3f46" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Geometric "K" Prism — 3 Stages of Production:
       1. Left Vertical Pillar (Criação - Blue)
       2. Upper Diagonal Wing (Exportação - Violet)
       3. Lower Diagonal Wing (Impressão - Emerald) -->

  <!-- 1. Left Pillar (Criação) -->
  <path d="M136 124C136 115.163 143.163 108 152 108H196C204.837 108 212 115.163 212 124V388C212 396.837 204.837 404 196 404H152C143.163 404 136 396.837 136 388V124Z" fill="url(#bladeBlue)"/>

  <!-- 2. Upper Wing (Exportação / Fechamento) -->
  <path d="M316 108H376C389.8 108 397.2 124.2 388.2 134.6L268 272H212V220L303.8 113.6C306.9 110 311.3 108 316 108Z" fill="url(#bladeViolet)"/>

  <!-- 3. Lower Wing (Impressão / Plotter) -->
  <path d="M264 236L390.4 377.4C399.6 387.7 392.3 404 378.5 404H314.6C309.9 404 305.4 401.9 302.3 398.4L212 296L264 236Z" fill="url(#bladeEmerald)"/>

  <!-- Precision Center Pivot Node -->
  <circle cx="212" cy="256" r="28" fill="#111113"/>
  <circle cx="212" cy="256" r="16" fill="#fafafa"/>
</svg>
